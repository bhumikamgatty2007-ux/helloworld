<!DOCTYPE html>
<html>
<head>
    <title>Hello World</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff6a00, #ee0979);
        }

        .box {
            text-align: center;
            background-color: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #ee0979;
            font-size: 50px;
        }

        p {
            color: #555;
            font-size: 22px;
        }

        button {
            background-color: #ff6a00;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ee0979;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Hello World! 🌎</h1>
        <p>Welcome to my webpage!</p>
        <button>Click Me</button>
    </div>

</body>
</html>
